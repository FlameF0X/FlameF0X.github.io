<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://raw.githubusercontent.com/FlameF0X/FlameF0X.github.io/refs/heads/main/assets/logo.png" type="image/png">
    <title>flame f0x — music</title>

    <meta property="og:title" content="flame f0x — music" />
    <meta property="og:description" content="a small music player." />
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        bg:     'var(--c-bg)',
                        card:   'var(--c-card)',
                        ink:    'var(--c-ink)',
                        muted:  'var(--c-muted)',
                        dim:    'var(--c-dim)',
                        line:   'var(--c-line)',
                        accent: 'var(--c-accent)',
                    }
                }
            }
        }
    </script>

    <!-- default palette; overwritten per-cover at runtime -->
    <style>
        :root {
            --c-bg:     hsl(38 30% 96.8%);
            --c-card:   hsl(38 27% 99.5%);
            --c-line:   hsl(38 18% 89.5%);
            --c-ink:    hsl(38 12% 8%);
            --c-muted:  hsl(38 18% 34%);
            --c-dim:    hsl(38 14% 55%);
            --c-accent: hsl(19 72% 48%);
            --c-scrim:  hsl(0 0% 0% / .45);
            --c-scroll: hsl(38 15% 82%);
            --c-shadow: 0 1px 2px rgba(0,0,0,.03), 0 8px 24px -12px rgba(0,0,0,.06);
            --g1:       hsl(19 70% 62%);
            --g2:       hsl(38 60% 75%);
        }
    </style>

    <style type="text/tailwindcss">
        body { @apply bg-bg text-ink font-sans antialiased; }
        ::selection { @apply bg-ink text-bg; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--c-scroll); border-radius: 999px; }
        ::-webkit-scrollbar-track { background: transparent; }

        .pill {
            @apply inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-muted border border-line rounded-full hover:border-ink hover:text-ink transition-colors;
        }
        .pill-solid {
            @apply inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium bg-ink text-bg border border-ink rounded-full hover:bg-accent hover:border-accent transition-colors;
        }

        .ctrl {
            @apply inline-flex items-center justify-center w-8 h-8 rounded-full text-muted hover:text-ink hover:bg-bg transition-colors;
        }
        .ctrl.on { @apply text-accent; }

        .album-card { @apply block w-full text-left cursor-pointer; }
        .album-card .cover-wrap { @apply relative aspect-square rounded-xl overflow-hidden border border-line bg-bg; }
        .album-card .cover-play {
            @apply absolute inset-0 flex items-center justify-center opacity-0 transition-opacity;
            background: var(--c-scrim);
        }
        .album-card:hover .cover-play, .album-card:focus-visible .cover-play { @apply opacity-100; }
        .album-card:hover .a-title { @apply text-accent; }
        .album-card.playing .cover-wrap { @apply border-accent; }

        .track-row { @apply flex items-center gap-3 px-1 py-2.5 cursor-pointer select-none; }
        .track-row .t-title { @apply transition-colors; }
        .track-row:hover .t-title { @apply text-accent; }
        .track-row.active .t-title { @apply text-accent; }
        .track-row.active .num { @apply text-accent; }

        .bars { display: none; }
        body.playing .track-row.active .num { display: none; }
        body.playing .track-row.active .bars { display: inline-flex; }
    </style>

    <style>
        main { box-shadow: var(--c-shadow); }

        /* ── very subtle accent glow, tinted by the cover ── */
        #ambient {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            transition: opacity .9s ease;
        }
        #ambient.off { opacity: 0; }
        #ambient .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(110px);
            opacity: .13;
            transition: background-color .9s ease;
            will-change: background-color;
        }
        #ambient .b1 { width: 70vmax; height: 70vmax; left: -22vmax; top: -26vmax; background: var(--g1); }
        #ambient .b2 { width: 55vmax; height: 55vmax; right: -20vmax; bottom: -22vmax; background: var(--g2); }

        /* ── smooth colour crossfade ── */
        :where(html.theme-live) :where(*, *::before, *::after) {
            transition:
                background-color 620ms ease,
                border-color 620ms ease,
                color 620ms ease,
                fill 620ms ease,
                stroke 620ms ease,
                box-shadow 620ms ease;
        }

        /* ── volume slider ── */
        input[type="range"].vol {
            -webkit-appearance: none; appearance: none;
            width: 68px; height: 3px;
            border-radius: 999px; outline: none; cursor: pointer;
            background: var(--c-line);
        }
        input[type="range"].vol::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 10px; height: 10px;
            border: none; border-radius: 50%;
            background: var(--c-ink);
            cursor: pointer;
            transition: background .15s;
        }
        input[type="range"].vol:hover::-webkit-slider-thumb { background: var(--c-accent); }
        input[type="range"].vol::-moz-range-track { height: 3px; border-radius: 999px; background: transparent; }
        input[type="range"].vol::-moz-range-thumb {
            width: 10px; height: 10px; border: none; border-radius: 50%;
            background: var(--c-ink); cursor: pointer;
        }

        /* ── equaliser ── */
        .bars i {
            display: block; width: 2px; background: var(--c-accent);
            border-radius: 1px; transform-origin: bottom;
            animation: eq .9s ease-in-out infinite;
        }
        .bars i:nth-child(1) { height: 11px; animation-delay: -.30s; }
        .bars i:nth-child(2) { height: 11px; animation-delay: -.55s; }
        .bars i:nth-child(3) { height: 11px; animation-delay: -.10s; }
        @keyframes eq {
            0%, 100% { transform: scaleY(.35); }
            50%      { transform: scaleY(1); }
        }
        @media (prefers-reduced-motion: reduce) { .bars i { animation: none; transform: scaleY(.7); } }
    </style>
</head>

<body class="min-h-screen flex justify-center px-4 py-10 md:py-16">

    <!-- ─── AMBIENT GLOW ─── -->
    <div id="ambient" aria-hidden="true">

                     alt="flame f0x"

                    </button>

            <a href="https://github.com/FlameF0X/FlameF0X.github.io" target="_blank" class="hover:text-ink transition-colors">source ↗</a>

<script>
(() => {
    'use strict';

    /* ══════════════════════════════════════════════════════════
       CONFIG
       ══════════════════════════════════════════════════════════ */
    const PLAYLIST_URL = './music/playlist.json';
    const LOGO = 'https://raw.githubusercontent.com/FlameF0X/FlameF0X.github.io/refs/heads/main/assets/logo.png';

    const $ = (id) => document.getElementById(id);
    const el = {
        ambient: $('ambient'), ambientBtn: $('ambientBtn'),
        cover: $('cover'), title: $('trackTitle'), artist: $('trackArtist'),
        seek: $('seek'), seekFill: $('seekFill'), seekThumb: $('seekThumb'),
        timeCurrent: $('timeCurrent'), timeDuration: $('timeDuration'),
        playBtn: $('playBtn'), prevBtn: $('prevBtn'), nextBtn: $('nextBtn'),
        shuffleBtn: $('shuffleBtn'), repeatBtn: $('repeatBtn'),
        muteBtn: $('muteBtn'), vol: $('vol'),
        viewAlbums: $('viewAlbums'), viewTracks: $('viewTracks'),
        albumGrid: $('albumGrid'), albumCount: $('albumCount'),
        backBtn: $('backBtn'), albumCover: $('albumCover'),
        albumTitle: $('albumTitle'), albumMeta: $('albumMeta'),
        playAlbumBtn: $('playAlbumBtn'), shuffleAlbumBtn: $('shuffleAlbumBtn'),
        list: $('playlist'),
    };

    const audio = new Audio();
    audio.preload = 'metadata';

    /* ─── state ─── */
    let albums = [];
    let explicit = false;
    let albumIndex = 0;
    let queueAlbum = -1;
    let current = -1;
    let shuffle = false;
    let repeat = 'off';
    let basePath = '';
    let dragging = false;
    let lastVol = 0.8;

    let glowOn = true;
    let lastCoverUrl = '';
    let currentPalette = null;
    let themeToken = 0;
    const themeCache = new Map();

    /* ─── icons ─── */
    const ICON_PLAY  = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.6v14.8L20 12z"/></svg>';
    const ICON_PAUSE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';
    const ICON_REPEAT = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>';
    const ICON_REPEAT_ONE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10.5h1.5v3.5"/></svg>';
    const ICON_VOL = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
    const ICON_MUTE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>';
    const ICON_CARD_PLAY = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

    const PLACEHOLDER = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
           <rect width="120" height="120" fill="#f3ede2"/>
           <g fill="#cfc6b4">
             <ellipse cx="45" cy="86" rx="11" ry="8.5" transform="rotate(-18 45 86)"/>
             <ellipse cx="82" cy="78" rx="11" ry="8.5" transform="rotate(-18 82 78)"/>
             <rect x="53" y="36" width="4.5" height="50"/>
             <rect x="90" y="28" width="4.5" height="50"/>
             <path d="M53 36 L94.5 28 L94.5 42 L53 50 Z"/>
           </g>
         </svg>`
    );

    /* ══════════════════════════════════════════════════════════
       COLOUR MATH
       ══════════════════════════════════════════════════════════ */
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

    function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        const l = (max + min) / 2;
        const d = max - min;
        let h = 0, s = 0;
        if (d > 1e-6) {
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            if (max === r)      h = ((g - b) / d + (g < b ? 6 : 0)) * 60;
            else if (max === g) h = ((b - r) / d + 2) * 60;
            else                h = ((r - g) / d + 4) * 60;
        }
        return { h, s, l };
    }

    /* most-populated 16³ colour bucket, smoothed with its neighbours */
    function dominantColor(px, N, predicate) {
        const NB = 16 * 16 * 16;
        const counts = new Uint32Array(NB);
        const sums = new Float64Array(NB * 3);
        let total = 0;

        for (let y = 0; y < N; y++) {
            for (let x = 0; x < N; x++) {
                if (!predicate(x, y)) continue;
                const i = (y * N + x) * 4;
                if (px[i + 3] < 120) continue;
                const r = px[i], g = px[i + 1], b = px[i + 2];
                const k = ((r >> 4) << 8) | ((g >> 4) << 4) | (b >> 4);
                counts[k]++;
                sums[k * 3] += r; sums[k * 3 + 1] += g; sums[k * 3 + 2] += b;
                total++;
            }
        }
        if (total < 24) return null;

        let best = -1, bestC = 0;
        for (let k = 0; k < NB; k++) if (counts[k] > bestC) { bestC = counts[k]; best = k; }

        const bR = (best >> 8) & 15, bG = (best >> 4) & 15, bB = best & 15;
        let sr = 0, sg = 0, sb = 0, sw = 0;
        for (let dr = -1; dr <= 1; dr++) {
            for (let dg = -1; dg <= 1; dg++) {
                for (let db = -1; db <= 1; db++) {
                    const rr = bR + dr, gg = bG + dg, bb = bB + db;
                    if (rr < 0 || rr > 15 || gg < 0 || gg > 15 || bb < 0 || bb > 15) continue;
                    const k = (rr << 8) | (gg << 4) | bb;
                    const c = counts[k];
                    if (!c) continue;
                    const w = c * ((dr === 0 && dg === 0 && db === 0) ? 1 : 0.45);
                    sr += sums[k * 3] * w;
                    sg += sums[k * 3 + 1] * w;
                    sb += sums[k * 3 + 2] * w;
                    sw += w;
                }
            }
        }
        return { r: sr / sw, g: sg / sw, b: sb / sw, total, share: bestC / total };
    }

    /* strongest saturated hue in the whole image → used for the accent */
    function mostSaturated(px, N) {
        const HB = 36;
        const w = new Float64Array(HB);
        const hs = new Float64Array(HB);
        const hl = new Float64Array(HB);

        for (let i = 0; i < px.length; i += 4) {
            if (px[i + 3] < 120) continue;
            const r = px[i] / 255, g = px[i + 1] / 255, b = px[i + 2] / 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            const d = max - min;
            if (d < 0.02) continue;
            const l = (max + min) / 2;
            const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            if (s < 0.22) continue;
            let h;
            if (max === r)      h = ((g - b) / d + (g < b ? 6 : 0)) * 60;
            else if (max === g) h = ((b - r) / d + 2) * 60;
            else                h = ((r - g) / d + 4) * 60;
            const bin = Math.min(HB - 1, Math.floor(h / 10));
            const weight = s * Math.max(0.15, 1 - Math.abs(l - 0.5) * 1.3);
            w[bin] += weight;
            hs[bin] += s * weight;
            hl[bin] += l * weight;
        }

        let best = -1, bestW = 0, sumW = 0;
        for (let i = 0; i < HB; i++) { sumW += w[i]; if (w[i] > bestW) { bestW = w[i]; best = i; } }
        if (best < 0 || sumW < 0.5) return null;
        return { h: best * 10 + 5, s: hs[best] / w[best], l: hl[best] / w[best] };
    }

    /* ══════════════════════════════════════════════════════════
       PALETTE — page takes the margin colour, contrast decides text
       ══════════════════════════════════════════════════════════ */
    function buildPalette(margin, accent) {
        const H  = margin.h;
        const S  = margin.s;
        const L  = margin.l;
        const dark = L < 0.5;

        const A  = accent ? accent.h : (H + 32) % 360;
        const AS = accent ? accent.s : 0.70;
        const AL = accent ? accent.l : 0.50;

        const hsl  = (h, s, l) => `hsl(${clamp(h, 0, 360).toFixed(1)} ${clamp(s * 100, 0, 100).toFixed(0)}% ${clamp(l * 100, 0, 100).toFixed(1)}%)`;

        const bgS = clamp(S, 0.06, 0.55);
        const bgL = dark ? clamp(L, 0.04, 0.32) : clamp(L, 0.70, 0.97);

        let cardL, lineL, inkS, mutedL, dimL, accentL, accentS;

        if (dark) {
            cardL   = clamp(bgL + 0.055, 0.08, 0.38);
            lineL   = clamp(bgL + 0.090, 0.12, 0.42);
            inkS    = 0.16;
            mutedL  = 0.70;
            dimL    = 0.48;
            accentL = clamp(Math.max(AL, 0.60), 0.58, 0.74);
            accentS = clamp(Math.max(AS, 0.60), 0.55, 0.88);
        } else {
            cardL   = clamp(bgL + 0.025, 0.86, 0.995);
            lineL   = clamp(bgL - 0.075, 0.68, 0.90);
            inkS    = 0.14;
            mutedL  = 0.34;
            dimL    = 0.55;
            accentL = clamp(Math.min(AL, 0.50), 0.38, 0.52);
            accentS = clamp(Math.max(AS, 0.60), 0.55, 0.88);
        }

        return {
            dark,
            bg:     hsl(H, bgS, bgL),
            card:   hsl(H, bgS * 0.9, cardL),
            line:   hsl(H, bgS * 0.6, lineL),
            ink:    hsl(H, inkS, dark ? 0.95 : 0.09),
            muted:  hsl(H, dark ? 0.18 : 0.20, mutedL),
            dim:    hsl(H, dark ? 0.14 : 0.16, dimL),
            accent: hsl(A, accentS, accentL),
            scrim:  'hsl(0 0% 0% / .45)',
            scroll: hsl(H, bgS * 0.5, dark ? clamp(bgL + 0.14, 0.16, 0.42) : clamp(bgL - 0.13, 0.60, 0.86)),
            g1:     hsl(A, 0.75, dark ? 0.55 : 0.78),
            g2:     hsl(H, 0.60, dark ? 0.45 : 0.82),
            shadow: dark
                ? '0 1px 2px rgba(0,0,0,.28), 0 10px 30px -12px rgba(0,0,0,.55)'
                : '0 1px 2px rgba(0,0,0,.03), 0 8px 24px -12px rgba(0,0,0,.06)',
        };
    }

    const DEFAULT_MARGIN = { h: 38, s: 0.30, l: 0.968 };
    const DEFAULT_ACCENT = { h: 19, s: 0.72, l: 0.48 };
    const DEFAULT_PALETTE = buildPalette(DEFAULT_MARGIN, DEFAULT_ACCENT);

    function applyPalette(p) {
        const s = document.documentElement.style;
        s.setProperty('--c-bg', p.bg);
        s.setProperty('--c-card', p.card);
        s.setProperty('--c-line', p.line);
        s.setProperty('--c-ink', p.ink);
        s.setProperty('--c-muted', p.muted);
        s.setProperty('--c-dim', p.dim);
        s.setProperty('--c-accent', p.accent);
        s.setProperty('--c-scrim', p.scrim);
        s.setProperty('--c-scroll', p.scroll);
        s.setProperty('--c-shadow', p.shadow);
        s.setProperty('--g1', p.g1);
        s.setProperty('--g2', p.g2);
        document.documentElement.style.colorScheme = p.dark ? 'dark' : 'light';
        currentPalette = p;
        paintVol();
    }

    /* ══════════════════════════════════════════════════════════
       THEME EXTRACTION (FIXED FOR CORS)
       ══════════════════════════════════════════════════════════ */
    async function setThemeFromCover(url) {
        lastCoverUrl = url || '';
        const token = ++themeToken;
        const key = lastCoverUrl || '__default__';

        if (!lastCoverUrl) {
            applyPalette(DEFAULT_PALETTE);
            return;
        }

        if (themeCache.has(key)) {
            applyPalette(themeCache.get(key));
            return;
        }

        try {
            // Fetch as blob to bypass canvas tainting issues (CORS)
            const res = await fetch(lastCoverUrl);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const blob = await res.blob();
            const img = await createImageBitmap(blob);

            const N = 64;
            const cv = document.createElement('canvas');
            cv.width = cv.height = N;
            const ctx = cv.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(img, 0, 0, N, N);

            const px = ctx.getImageData(0, 0, N, N).data;

            // Outer 12% ring
            const m = Math.max(2, Math.round(N * 0.12));
            const isMargin = (x, y) => x < m || x >= N - m || y < m || y >= N - m;

            const margin = dominantColor(px, N, isMargin) || dominantColor(px, N, () => true);
            if (!margin) throw new Error('no margin color found');

            const accent = mostSaturated(px, N);
            const marginHsl = rgbToHsl(margin.r, margin.g, margin.b);
            
            const pal = buildPalette(marginHsl, accent);

            if (token === themeToken) {
                themeCache.set(key, pal);
                applyPalette(pal);
            }
        } catch (e) {
            console.error('Theme extraction failed:', e);
            if (token === themeToken) applyPalette(DEFAULT_PALETTE);
        }
    }

    function setGlow(on) {
        glowOn = !!on;
        el.ambient.classList.toggle('off', !glowOn);
        el.ambientBtn.textContent = 'glow · ' + (glowOn ? 'on' : 'off');
        el.ambientBtn.setAttribute('aria-pressed', String(glowOn));
        try { localStorage.setItem('ff-music-glow', glowOn ? '1' : '0'); } catch (e) {}
    }

    /* ══════════════════════════════════════════════════════════
       HELPERS
       ══════════════════════════════════════════════════════════ */
    const esc = (s) => String(s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const fmt = (s) => {
        if (!s || !isFinite(s) || s < 0) s = 0;
        const m = Math.floor(s / 60);
        return m + ':' + String(Math.floor(s % 60)).padStart(2, '0');
    };

    function resolveUrl(p) {
        if (!p) return '';
        if (/^(https?:)?\/\//i.test(p) || p.startsWith('data:') || p.startsWith('/')) return p;
        return basePath + p.replace(/^\.\//, '');
    }

    function normalizeTrack(t) {
        if (typeof t === 'string') t = { file: t };
        const file = t.file || t.src || t.url || '';
        const fallback = decodeURIComponent((file.split('/').pop() || '').replace(/\.[^.]+$/, ''));
        return {
            title: t.title || t.name || fallback || 'untitled',
            artist: t.artist || t.author || t.by || '',
            src: resolveUrl(file),
            cover: resolveUrl(t.cover || t.artwork || t.art || t.image || ''),
            duration: typeof t.duration === 'number' ? t.duration : null,
        };
    }

    function normalizeAlbum(a) {
        const raw = Array.isArray(a) ? { tracks: a } : a;
        return {
            title: raw.title || raw.name || 'untitled album',
            artist: raw.artist || raw.author || '',
            year: raw.year || '',
            cover: resolveUrl(raw.cover || raw.artwork || raw.image || ''),
            tracks: (raw.tracks || raw.songs || raw.items || []).map(normalizeTrack),
        };
    }

    const albumOfQueue = () => (queueAlbum >= 0 ? albums[queueAlbum] : null);

    /* ══════════════════════════════════════════════════════════
       VIEWS
       ══════════════════════════════════════════════════════════ */
    function showAlbumsView() {
        if (!explicit) return;
        el.viewAlbums.classList.remove('hidden');
        el.viewTracks.classList.add('hidden');
    }
    function showTracksView() {
        el.viewAlbums.classList.add('hidden');
        el.viewTracks.classList.remove('hidden');
    }

    function openAlbum(i, goToView = true) {
        if (!albums[i]) return;
        albumIndex = i;
        renderTracks();
        if (goToView) showTracksView();
        setThemeFromCover(albums[i].cover || '');
    }

    /* ══════════════════════════════════════════════════════════
       RENDER: ALBUMS
       ══════════════════════════════════════════════════════════ */
    function renderAlbums() {
        el.albumGrid.innerHTML = '';
        albums.forEach((al, i) => {
            const card = document.createElement('div');
            card.className = 'album-card group focus:outline-none';
            card.tabIndex = 0;
            card.setAttribute('role', 'button');
            card.setAttribute('aria-label', 'open album ' + al.title);
            card.innerHTML =
                '<div class="cover-wrap">' +
                    '<img alt="" class="w-full h-full object-cover" src="' + esc(al.cover || PLACEHOLDER) + '">' +
                    '<button class="cover-play" aria-label="play album">' +
                        '<span class="w-9 h-9 rounded-full bg-white/90 text-ink flex items-center justify-center shadow-sm">' +
                            ICON_CARD_PLAY +
                        '</span>' +
                    '</button>' +
                '</div>' +
                '<p class="a-title mt-2 text-[13px] font-medium truncate transition-colors">' + esc(al.title) + '</p>' +
                '<p class="text-[11px] text-dim truncate">' +
                    esc([al.artist || '', al.tracks.length + ' track' + (al.tracks.length === 1 ? '' : 's')]
                        .filter(Boolean).join(' · ')) +
                '</p>';

            card.addEventListener('click', () => openAlbum(i));
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAlbum(i); }
            });

            const playBtn = card.querySelector('.cover-play');
            playBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                openAlbum(i, false);
                if (queueAlbum === i && current === 0) toggle();
                else playTrack(i, 0);
            });

            el.albumGrid.appendChild(card);
        });
        el.albumCount.textContent = albums.length + ' album' + (albums.length === 1 ? '' : 's');
        paintAlbumCards();
    }

    function paintAlbumCards() {
        Array.from(el.albumGrid.children).forEach((card, i) => {
            card.classList.toggle('playing', i === queueAlbum);
        });
    }

    /* ══════════════════════════════════════════════════════════
       RENDER: TRACKS
       ══════════════════════════════════════════════════════════ */
    function renderTracks() {
        const al = albums[albumIndex];
        if (!al) return;

        el.albumTitle.textContent = al.title;
        const meta = [];
        if (al.artist) meta.push(al.artist);
        if (al.year) meta.push(al.year);
        meta.push(al.tracks.length + ' track' + (al.tracks.length === 1 ? '' : 's'));
        el.albumMeta.textContent = meta.join(' · ');

        const img = el.albumCover;
        img.onerror = () => { img.onerror = null; img.src = PLACEHOLDER; };
        img.src = al.cover || PLACEHOLDER;

        el.list.innerHTML = '';
        al.tracks.forEach((t, i) => {
            const li = document.createElement('li');
            li.className = 'track-row';
            li.innerHTML =
                '<span class="w-5 shrink-0 text-center">' +
                    '<span class="num font-mono text-[11px] text-dim">' + String(i + 1).padStart(2, '0') + '</span>' +
                    '<span class="bars gap-[2px]"><i></i><i></i><i></i></span>' +
                '</span>' +
                '<span class="min-w-0 flex-1">' +
                    '<span class="t-title block text-[14px] font-medium truncate">' + esc(t.title) + '</span>' +
                    (t.artist ? '<span class="block text-[11px] text-dim truncate mt-0.5">' + esc(t.artist) + '</span>' : '') +
                '</span>' +
                '<span class="dur shrink-0 font-mono text-[11px] text-dim">' + (t.duration ? fmt(t.duration) : '--:--') + '</span>';

            li.addEventListener('click', () => {
                if (queueAlbum === albumIndex && i === current) toggle();
                else playTrack(albumIndex, i);
            });
            el.list.appendChild(li);
        });

        paintRows();
    }

    function paintRows() {
        Array.from(el.list.children).forEach((row, i) => {
            row.classList.toggle('active', albumIndex === queueAlbum && i === current);
        });
    }

    function updateRowDuration(i) {
        const row = el.list.children[i];
        if (!row) return;
        const d = row.querySelector('.dur');
        const t = albums[albumIndex] && albums[albumIndex].tracks[i];
        if (d && t) d.textContent = t.duration ? fmt(t.duration) : '--:--';
    }

    /* ══════════════════════════════════════════════════════════
       NOW PLAYING
       ══════════════════════════════════════════════════════════ */
    function setCover(url) {
        const img = el.cover;
        img.onerror = () => { img.onerror = null; img.src = PLACEHOLDER; };
        img.src = url || PLACEHOLDER;
    }

    function updateNowPlaying() {
        const al = albumOfQueue();
        const t = al && al.tracks[current];
        if (!t) {
            el.title.textContent = 'nothing playing';
            el.artist.textContent = 'press play to start';
            setCover('');
            return;
        }
        el.title.textContent = t.title;
        el.artist.textContent = t.artist || al.artist || al.title || '—';
        const art = t.cover || al.cover || '';
        setCover(art);
        updateMediaSession(t, al);
        setThemeFromCover(art);
    }

    function updateMediaSession(t, al) {
        if (!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
        try {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: t.title,
                artist: t.artist || al.artist || 'flame f0x',
                album: al.title || 'flame f0x — music',
                artwork: [{ src: t.cover || al.cover || LOGO, sizes: '512x512' }],
            });
        } catch (e) {}
    }

    /* ══════════════════════════════════════════════════════════
       PLAYBACK
       ══════════════════════════════════════════════════════════ */
    function playTrack(aIdx, tIdx) {
        const al = albums[aIdx];
        if (!al || !al.tracks[tIdx]) return;
        queueAlbum = aIdx;
        current = tIdx;
        audio.src = al.tracks[current].src;
        audio.play().catch(() => {});
        updateNowPlaying();
        paintRows();
        paintAlbumCards();
    }

    function toggle() {
        if (!albumOfQueue()) return;
        if (audio.paused) audio.play().catch(() => {});
        else audio.pause();
    }

    function next() {
        const al = albumOfQueue();
        if (!al || !al.tracks.length) return;
        if (shuffle && al.tracks.length > 1) return playTrack(queueAlbum, randomIndex(al.tracks.length));
        playTrack(queueAlbum, current + 1);
    }

    function prev() {
        const al = albumOfQueue();
        if (!al || !al.tracks.length) return;
        if (audio.currentTime > 3) { audio.currentTime = 0; updateProgress(); return; }
        playTrack(queueAlbum, current - 1);
    }

    function randomIndex(len) {
        if (len < 2) return current;
        let i = current;
        while (i === current) i = Math.floor(Math.random() * len);
        return i;
    }

    function onEnded() {
        const al = albumOfQueue();
        if (!al || !al.tracks.length) return;
        if (repeat === 'one') { audio.currentTime = 0; audio.play().catch(() => {}); return; }
        if (shuffle && al.tracks.length > 1) return playTrack(queueAlbum, randomIndex(al.tracks.length));
        if (current < al.tracks.length - 1) return playTrack(queueAlbum, current + 1);
        if (repeat === 'all') return playTrack(queueAlbum, 0);
    }

    /* ══════════════════════════════════════════════════════════
       PROGRESS
       ══════════════════════════════════════════════════════════ */
    function updateProgress() {
        const d = audio.duration;
        const pct = (d && isFinite(d)) ? Math.min(100, (audio.currentTime / d) * 100) : 0;
        el.seekFill.style.width = pct + '%';
        el.seekThumb.style.left = pct + '%';
        el.timeCurrent.textContent = fmt(audio.currentTime);
    }

    function seekTo(ratio) {
        const d = audio.duration;
        if (!d || !isFinite(d)) return;
        audio.currentTime = ratio * d;
        el.seekFill.style.width = (ratio * 100) + '%';
        el.seekThumb.style.left = (ratio * 100) + '%';
        el.timeCurrent.textContent = fmt(ratio * d);
    }

    function ratioFrom(e) {
        const r = el.seek.getBoundingClientRect();
        return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    }

    function seekBy(delta) {
        if (!audio.duration || !isFinite(audio.duration)) return;
        audio.currentTime = Math.min(audio.duration, Math.max(0, audio.currentTime + delta));
        updateProgress();
    }

    /* ══════════════════════════════════════════════════════════
       VOLUME
       ══════════════════════════════════════════════════════════ */
    function paintVol() {
        const p = (parseFloat(el.vol.value) * 100).toFixed(1);
        const ink  = (currentPalette && currentPalette.ink)  || '#0f0f0f';
        const line = (currentPalette && currentPalette.line) || '#ece7dd';
        el.vol.style.background =
            'linear-gradient(to right,' +
            ' ' + ink + ' 0%,' +
            ' ' + ink + ' ' + p + '%,' +
            ' ' + line + ' ' + p + '%,' +
            ' ' + line + ' 100%)';
    }

    function setVolume(v) {
        v = Math.min(1, Math.max(0, v));
        audio.volume = v;
        el.vol.value = v;
        if (v > 0) lastVol = v;
        el.muteBtn.innerHTML = v === 0 ? ICON_MUTE : ICON_VOL;
        paintVol();
        try { localStorage.setItem('ff-music-vol', String(v)); } catch (e) {}
    }

    /* ══════════════════════════════════════════════════════════
       UI STATE
       ══════════════════════════════════════════════════════════ */
    function setPlayingUI(on) {
        el.playBtn.innerHTML = on ? ICON_PAUSE : ICON_PLAY;
        el.playBtn.setAttribute('aria-label', on ? 'pause' : 'play');
        document.body.classList.toggle('playing', on);
        if ('mediaSession' in navigator) {
            try { navigator.mediaSession.playbackState = on ? 'playing' : 'paused'; } catch (e) {}
        }
    }

    /* ══════════════════════════════════════════════════════════
       DURATIONS
       ══════════════════════════════════════════════════════════ */
    function loadDurations() {
        albums.forEach((al, ai) => al.tracks.forEach((t, ti) => {
            if (t.duration) return;
            const probe = new Audio();
            probe.preload = 'metadata';
            probe.onloadedmetadata = () => {
                if (isFinite(probe.duration)) {
                    t.duration = probe.duration;
                    if (ai === albumIndex) updateRowDuration(ti);
                }
                probe.removeAttribute('src');
                try { probe.load(); } catch (e) {}
            };
            probe.onerror = () => { probe.onerror = null; };
            probe.src = t.src;
        }));
    }

    /* ══════════════════════════════════════════════════════════
       ERROR
       ══════════════════════════════════════════════════════════ */
    function showError(err) {
        explicit = true;
        showAlbumsView();
        el.albumCount.textContent = '0 albums';
        el.albumGrid.innerHTML =
            '<div class="col-span-full py-4 text-center">' +
                '<p class="text-[13px] text-muted mb-1">couldn\'t load the library</p>' +
                '<p class="font-mono text-[11px] text-dim mb-4">' + esc(String(err && err.message || err)) + '</p>' +
                '<pre class="text-left font-mono text-[10px] leading-relaxed text-muted bg-bg border border-line rounded-lg p-3 overflow-x-auto">' +
                    'expected at <span class="text-accent">./music/playlist.json</span>\n\n' +
                    '{\n' +
                    '  "albums": [\n' +
                    '    {\n' +
                    '      "title": "album name",\n' +
                    '      "artist": "you",\n' +
                    '      "cover": "cover.jpg",\n' +
                    '      "tracks": [\n' +
                    '        { "title": "song", "file": "song.mp3" }\n' +
                    '      ]\n' +
                    '    }\n' +
                    '  ]\n' +
                    '}' +
                '</pre>' +
            '</div>';
    }

    /* ══════════════════════════════════════════════════════════
       WIRING
       ══════════════════════════════════════════════════════════ */
    el.playBtn.addEventListener('click', toggle);
    el.prevBtn.addEventListener('click', prev);
    el.nextBtn.addEventListener('click', next);
    el.backBtn.addEventListener('click', showAlbumsView);

    el.playAlbumBtn.addEventListener('click', () => {
        const al = albums[albumIndex];
        if (!al || !al.tracks.length) return;
        if (queueAlbum === albumIndex && current === 0) toggle();
        else playTrack(albumIndex, 0);
    });

    el.shuffleAlbumBtn.addEventListener('click', () => {
        const al = albums[albumIndex];
        if (!al || !al.tracks.length) return;
        shuffle = true;
        el.shuffleBtn.classList.add('on');
        el.shuffleBtn.setAttribute('aria-pressed', 'true');
        playTrack(albumIndex, Math.floor(Math.random() * al.tracks.length));
    });

    el.shuffleBtn.addEventListener('click', () => {
        shuffle = !shuffle;
        el.shuffleBtn.classList.toggle('on', shuffle);
        el.shuffleBtn.setAttribute('aria-pressed', String(shuffle));
    });

    el.repeatBtn.addEventListener('click', () => {
        repeat = repeat === 'off' ? 'all' : repeat === 'all' ? 'one' : 'off';
        el.repeatBtn.classList.toggle('on', repeat !== 'off');
        el.repeatBtn.innerHTML = repeat === 'one' ? ICON_REPEAT_ONE : ICON_REPEAT;
        el.repeatBtn.title = 'repeat: ' + repeat;
    });

    el.muteBtn.addEventListener('click', () => {
        if (parseFloat(el.vol.value) > 0) setVolume(0);
        else setVolume(lastVol || 0.8);
    });
    el.vol.addEventListener('input', () => setVolume(parseFloat(el.vol.value)));

    el.ambientBtn.addEventListener('click', () => setGlow(!glowOn));

    /* seek dragging */
    el.seek.addEventListener('pointerdown', (e) => {
        if (!audio.duration || !isFinite(audio.duration)) return;
        dragging = true;
        el.seek.setPointerCapture(e.pointerId);
        seekTo(ratioFrom(e));
    });
    el.seek.addEventListener('pointermove', (e) => { if (dragging) seekTo(ratioFrom(e)); });
    const endDrag = (e) => {
        if (!dragging) return;
        dragging = false;
        try { el.seek.releasePointerCapture(e.pointerId); } catch (err) {}
    };
    el.seek.addEventListener('pointerup', endDrag);
    el.seek.addEventListener('pointercancel', () => { dragging = false; });

    /* audio events */
    audio.addEventListener('loadedmetadata', () => {
        el.timeDuration.textContent = fmt(audio.duration);
        updateProgress();
        const al = albumOfQueue();
        const t = al && al.tracks[current];
        if (t && !t.duration && isFinite(audio.duration)) {
            t.duration = audio.duration;
            if (queueAlbum === albumIndex) updateRowDuration(current);
        }
    });
    audio.addEventListener('timeupdate', () => { if (!dragging) updateProgress(); });
    audio.addEventListener('play', () => setPlayingUI(true));
    audio.addEventListener('pause', () => setPlayingUI(false));
    audio.addEventListener('ended', onEnded);

    /* keyboard */
    document.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

        switch (e.code) {
            case 'Space':      e.preventDefault(); toggle(); break;
            case 'ArrowRight': e.preventDefault(); seekBy(5); break;
            case 'ArrowLeft':  e.preventDefault(); seekBy(-5); break;
            case 'ArrowUp':    e.preventDefault(); setVolume(audio.volume + 0.05); break;
            case 'ArrowDown':  e.preventDefault(); setVolume(audio.volume - 0.05); break;
            case 'KeyN':       next(); break;
            case 'KeyP':       prev(); break;
            case 'KeyS':       el.shuffleBtn.click(); break;
            case 'KeyR':       el.repeatBtn.click(); break;
            case 'KeyM':       el.muteBtn.click(); break;
            case 'KeyA':       setGlow(!glowOn); break;
            case 'Escape':     showAlbumsView(); break;
        }
    });

    /* ══════════════════════════════════════════════════════════
       INIT
       ══════════════════════════════════════════════════════════ */
    async function init() {
        el.playBtn.innerHTML = ICON_PLAY;
        el.muteBtn.innerHTML = ICON_VOL;
        setCover('');

        /* glow preference */
        try {
            const g = localStorage.getItem('ff-music-glow');
            if (g !== null) glowOn = g === '1';
        } catch (e) {}
        el.ambient.classList.toggle('off', !glowOn);
        el.ambientBtn.textContent = 'glow · ' + (glowOn ? 'on' : 'off');
        el.ambientBtn.setAttribute('aria-pressed', String(glowOn));

        /* volume preference */
        let savedVol = 0.8;
        try {
            const v = localStorage.getItem('ff-music-vol');
            if (v !== null) savedVol = parseFloat(v);
        } catch (e) {}
        setVolume(isNaN(savedVol) ? 0.8 : savedVol);

        applyPalette(DEFAULT_PALETTE);

        if ('mediaSession' in navigator) {
            try {
                navigator.mediaSession.setActionHandler('play', () => audio.play().catch(() => {}));
                navigator.mediaSession.setActionHandler('pause', () => audio.pause());
                navigator.mediaSession.setActionHandler('previoustrack', prev);
                navigator.mediaSession.setActionHandler('nexttrack', next);
                navigator.mediaSession.setActionHandler('seekbackward', () => seekBy(-10));
                navigator.mediaSession.setActionHandler('seekforward', () => seekBy(10));
            } catch (e) {}
        }

        try {
            const res = await fetch(PLAYLIST_URL, { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();

            basePath = PLAYLIST_URL.replace(/[^/]*$/, '');

            if (Array.isArray(data)) {
                albums = [normalizeAlbum({ title: 'all tracks', tracks: data })];
                explicit = false;
            } else if (Array.isArray(data.albums)) {
                albums = data.albums.map(normalizeAlbum);
                explicit = true;
            } else if (Array.isArray(data.tracks) || Array.isArray(data.songs)) {
                albums = [normalizeAlbum({
                    title: data.title || 'all tracks',
                    artist: data.artist || '',
                    cover: data.cover || '',
                    tracks: data.tracks || data.songs,
                })];
                explicit = false;
            } else {
                throw new Error('no albums or tracks in json');
            }

            albums = albums.filter(a => a.tracks.length);
            if (!albums.length) throw new Error('library is empty');

            if (explicit) {
                renderAlbums();
                albumIndex = 0;
                renderTracks();
                showAlbumsView();
            } else {
                el.viewAlbums.classList.add('hidden');
                el.backBtn.classList.add('hidden');
                albumIndex = 0;
                renderTracks();
                showTracksView();
            }

            loadDurations();

            queueAlbum = 0;
            current = 0;
            audio.src = albums[0].tracks[0].src;
            updateNowPlaying();
            paintRows();
            paintAlbumCards();
        } catch (err) {
            showError(err);
        }

        /* enable colour crossfades after the first paint */
        requestAnimationFrame(() => {
            requestAnimationFrame(() => document.documentElement.classList.add('theme-live'));
        });
    }

    init();
})();
</script>

</body>
</html>
